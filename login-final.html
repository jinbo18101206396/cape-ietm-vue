<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IETM系统登录 - 武器装备交互式电子技术手册</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Chinese Quote", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: rgba(0, 0, 0, 0.85);
      height: 100vh;
      overflow: hidden;
    }

    #userLayout {
      height: 100%;
      width: 100%;
      display: flex;
    }

    /* 左侧品牌区 */
    .brand-section {
      flex: 1;
      background: linear-gradient(135deg, #1a3a52 0%, #2c5364 100%);
      padding: 60px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .bg-pattern {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      opacity: 0.05;
      background-image:
        linear-gradient(30deg, transparent 48%, rgba(255,255,255,.1) 49%, rgba(255,255,255,.1) 51%, transparent 52%),
        linear-gradient(-30deg, transparent 48%, rgba(255,255,255,.1) 49%, rgba(255,255,255,.1) 51%, transparent 52%);
      background-size: 50px 50px;
    }

    .brand-content {
      position: relative;
      z-index: 1;
    }

    .logo-area {
      margin-bottom: 60px;
    }

    .logo-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .logo {
      width: 56px;
      height: 56px;
    }

    .brand-title {
      font-size: 36px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 2px;
    }

    .brand-subtitle {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .brand-org {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.65);
    }

    .features-list {
      margin-top: 80px;
    }

    .feature-item {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 32px;
      color: rgba(255, 255, 255, 0.9);
    }

    .feature-icon-box {
      width: 48px;
      height: 48px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .feature-icon {
      width: 24px;
      height: 24px;
      color: #1890FF;
    }

    .feature-text h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .feature-text p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.6;
    }

    .brand-footer {
      position: relative;
      z-index: 1;
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
    }

    /* 右侧登录区 */
    .login-section {
      flex: 0 0 500px;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 8px;
      padding: 48px 40px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-title {
      font-size: 24px;
      font-weight: 600;
      color: rgba(0, 0, 0, 0.85);
      margin-bottom: 8px;
    }

    .login-subtitle {
      font-size: 14px;
      color: rgba(0, 0, 0, 0.45);
    }

    .form-item {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      color: rgba(0, 0, 0, 0.85);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .input-wrapper {
      position: relative;
    }

    .input-prefix {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(0, 0, 0, 0.25);
      font-size: 16px;
    }

    .form-input {
      width: 100%;
      height: 40px;
      padding: 4px 11px 4px 40px;
      font-size: 14px;
      color: rgba(0, 0, 0, 0.85);
      background: #fff;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      transition: all 0.3s;
      outline: none;
    }

    .form-input:hover {
      border-color: #40a9ff;
    }

    .form-input:focus {
      border-color: #40a9ff;
      box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
    }

    .form-input::placeholder {
      color: rgba(0, 0, 0, 0.25);
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .checkbox {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #1890FF;
    }

    .checkbox-label {
      font-size: 14px;
      color: rgba(0, 0, 0, 0.65);
      cursor: pointer;
      user-select: none;
    }

    .forgot-link {
      font-size: 14px;
      color: #1890FF;
      text-decoration: none;
    }

    .forgot-link:hover {
      color: #40a9ff;
    }

    .login-button {
      width: 100%;
      height: 40px;
      font-size: 16px;
      font-weight: 500;
      color: #fff;
      background: #1890FF;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .login-button:hover {
      background: #40a9ff;
    }

    .login-button:active {
      background: #096dd9;
    }

    .divider {
      margin: 32px 0 24px;
      text-align: center;
      position: relative;
    }

    .divider::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 1px;
      background: #f0f0f0;
    }

    .divider-text {
      position: relative;
      display: inline-block;
      padding: 0 16px;
      background: white;
      font-size: 14px;
      color: rgba(0, 0, 0, 0.45);
    }

    .register-link {
      text-align: center;
      font-size: 14px;
      color: rgba(0, 0, 0, 0.65);
    }

    .register-link a {
      color: #1890FF;
      text-decoration: none;
      margin-left: 4px;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    /* 响应式 */
    @media (max-width: 968px) {
      #userLayout {
        flex-direction: column;
      }

      .brand-section {
        flex: 0 0 auto;
        min-height: 300px;
        padding: 40px 30px;
      }

      .features-list {
        display: none;
      }

      .login-section {
        flex: 1;
        padding: 40px 20px;
      }
    }
  </style>
</head>
<body>
  <div id="userLayout">
    <!-- 左侧品牌区 -->
    <div class="brand-section">
      <div class="bg-pattern"></div>

      <div class="brand-content">
        <div class="logo-area">
          <div class="logo-wrapper">
            <svg class="logo" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" style="stop-color:#1890FF;stop-opacity:1" />
                  <stop offset="100%" style="stop-color:#096dd9;stop-opacity:1" />
                </linearGradient>
              </defs>
              <rect width="56" height="56" rx="8" fill="url(#grad)"/>
              <rect x="10" y="10" width="36" height="36" fill="none" stroke="#fff" stroke-width="2.5"/>
              <rect x="16" y="24" width="24" height="22" fill="#fff"/>
              <circle cx="28" cy="18" r="4" fill="#fff"/>
              <path d="M28 4 L32 8 L28 12 L24 8 Z" fill="#ffd700"/>
            </svg>
            <span class="brand-title">IETM</span>
          </div>
          <h2 class="brand-subtitle">武器装备交互式电子技术手册</h2>
          <p class="brand-org">中国航空综合技术研究所</p>
        </div>

        <div class="features-list">
          <div class="feature-item">
            <div class="feature-icon-box">
              <svg class="feature-icon" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
              </svg>
            </div>
            <div class="feature-text">
              <h3>军工级保密</h3>
              <p>符合国家保密标准，多重加密机制保障数据安全</p>
            </div>
          </div>

          <div class="feature-item">
            <div class="feature-icon-box">
              <svg class="feature-icon" fill="currentColor" viewBox="0 0 24 24">
                <path d="M21 16.5c0 .38-.21.71-.53.88l-7.9 4.44c-.16.12-.36.18-.57.18-.21 0-.41-.06-.57-.18l-7.9-4.44C3.21 17.21 3 16.88 3 16.5v-9c0-.38.21-.71.53-.88l7.9-4.44c.16-.12.36-.18.57-.18.21 0 .41.06.57.18l7.9 4.44c.32.17.53.5.53.88v9z"/>
              </svg>
            </div>
            <div class="feature-text">
              <h3>3D交互模型</h3>
              <p>支持装备三维模型展示，可交互式查看零部件结构</p>
            </div>
          </div>

          <div class="feature-item">
            <div class="feature-icon-box">
              <svg class="feature-icon" fill="currentColor" viewBox="0 0 24 24">
                <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
              </svg>
            </div>
            <div class="feature-text">
              <h3>智能技术手册</h3>
              <p>结构化文档管理，快速检索定位，版本全生命周期追踪</p>
            </div>
          </div>
        </div>
      </div>

      <div class="brand-footer">
        <p>Copyright © 2026 中国航空综合技术研究所 | 版权所有</p>
      </div>
    </div>

    <!-- 右侧登录区 -->
    <div class="login-section">
      <div class="login-card">
        <div class="login-header">
          <h2 class="login-title">用户登录</h2>
          <p class="login-subtitle">欢迎使用IETM系统</p>
        </div>

        <form onsubmit="event.preventDefault(); handleLogin();">
          <div class="form-item">
            <label class="form-label">账号</label>
            <div class="input-wrapper">
              <svg class="input-prefix" viewBox="64 64 896 896" width="1em" height="1em" fill="currentColor">
                <path d="M858.5 763.6a374 374 0 00-80.6-119.5 375.63 375.63 0 00-119.5-80.6c-.4-.2-.8-.3-1.2-.5C719.5 518 760 444.7 760 362c0-137-111-248-248-248S264 225 264 362c0 82.7 40.5 156 102.8 201.1-.4.2-.8.3-1.2.5-44.8 18.9-85 46-119.5 80.6a375.63 375.63 0 00-80.6 119.5A371.7 371.7 0 00136 901.8a8 8 0 008 8.2h60c4.4 0 7.9-3.5 8-7.8 2-77.2 33-149.5 87.8-204.3 56.7-56.7 132-87.9 212.2-87.9s155.5 31.2 212.2 87.9C779 752.7 810 825 812 902.2c.1 4.4 3.6 7.8 8 7.8h60a8 8 0 008-8.2c-1-47.8-10.9-94.3-29.5-138.2zM512 534c-45.9 0-89.1-17.9-121.6-50.4S340 407.9 340 362c0-45.9 17.9-89.1 50.4-121.6S466.1 190 512 190s89.1 17.9 121.6 50.4S684 316.1 684 362c0 45.9-17.9 89.1-50.4 121.6S557.9 534 512 534z"></path>
              </svg>
              <input type="text" class="form-input" placeholder="请输入账号 / admin" value="admin" id="username" />
            </div>
          </div>

          <div class="form-item">
            <label class="form-label">密码</label>
            <div class="input-wrapper">
              <svg class="input-prefix" viewBox="64 64 896 896" width="1em" height="1em" fill="currentColor">
                <path d="M832 464h-68V240c0-70.7-57.3-128-128-128H388c-70.7 0-128 57.3-128 128v224h-68c-17.7 0-32 14.3-32 32v384c0 17.7 14.3 32 32 32h640c17.7 0 32-14.3 32-32V496c0-17.7-14.3-32-32-32zM332 240c0-30.9 25.1-56 56-56h248c30.9 0 56 25.1 56 56v224H332V240zm460 600H232V536h560v304zM484 701v53c0 4.4 3.6 8 8 8h40c4.4 0 8-3.6 8-8v-53a48.01 48.01 0 10-56 0z"></path>
              </svg>
              <input type="password" class="form-input" placeholder="请输入密码 / 123456" value="123456" id="password" />
            </div>
          </div>

          <div class="form-options">
            <div class="checkbox-wrapper">
              <input type="checkbox" id="remember" class="checkbox" checked />
              <label for="remember" class="checkbox-label">记住我</label>
            </div>
            <a href="#" class="forgot-link" onclick="event.preventDefault(); alert('忘记密码');">忘记密码?</a>
          </div>

          <button type="submit" class="login-button" id="loginBtn">确定</button>

          <div class="divider">
            <span class="divider-text">其他方式</span>
          </div>

          <div class="register-link">
            还没有账号?<a href="#" onclick="event.preventDefault(); alert('注册功能');">立即注册</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    function handleLogin() {
      const btn = document.getElementById('loginBtn');
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (!username) {
        alert('请输入账号');
        return;
      }

      if (!password) {
        alert('请输入密码');
        return;
      }

      btn.disabled = true;
      btn.textContent = '登录中...';

      setTimeout(() => {
        alert('登录成功！即将跳转到系统主页...');
        btn.disabled = false;
        btn.textContent = '确定';
      }, 1000);
    }

    document.addEventListener('keyup', function(e) {
      if (e.key === 'Enter') {
        handleLogin();
      }
    });
  </script>
</body>
</html>
