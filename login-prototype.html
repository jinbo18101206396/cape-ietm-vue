<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IETM系统登录 - 原型图</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #1F2421;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .login-container {
      display: flex;
      min-height: 100vh;
    }

    /* 左侧品牌区 */
    .brand-section {
      flex: 0 0 40%;
      background: linear-gradient(135deg, #1F2421 0%, #2a2d2b 100%);
      padding: 60px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .brand-section::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(196, 97, 47, 0.15) 0%, transparent 70%);
      border-radius: 50%;
    }

    .brand-section::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -10%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(196, 97, 47, 0.1) 0%, transparent 70%);
      border-radius: 50%;
    }

    .brand-content {
      position: relative;
      z-index: 1;
    }

    .logo-area {
      margin-bottom: 80px;
    }

    .logo {
      width: 56px;
      height: 56px;
      background: #C4612F;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(196, 97, 47, 0.3);
    }

    .logo svg {
      width: 32px;
      height: 32px;
      fill: white;
    }

    .brand-title {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      font-weight: 600;
      color: #FFFFFF;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    .brand-title em {
      font-style: italic;
      color: #C4612F;
    }

    .brand-subtitle {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    .visual-element {
      margin: 60px 0;
      position: relative;
    }

    .feature-pills {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .feature-pill {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 24px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
      font-weight: 400;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      width: fit-content;
    }

    .feature-pill:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateX(8px);
    }

    .feature-icon {
      width: 20px;
      height: 20px;
      background: rgba(196, 97, 47, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .feature-icon::before {
      content: '✓';
      color: #C4612F;
      font-size: 12px;
      font-weight: 600;
    }

    .brand-footer {
      position: relative;
      z-index: 1;
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      font-weight: 300;
    }

    /* 右侧登录区 */
    .login-section {
      flex: 0 0 60%;
      background: #F7F4EF;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
    }

    .login-header {
      margin-bottom: 40px;
    }

    .eyebrow {
      display: inline-block;
      padding: 6px 16px;
      background: #F2E3D6;
      color: #C4612F;
      font-size: 12px;
      font-weight: 500;
      border-radius: 999px;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .login-title {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      font-weight: 400;
      color: #1F2421;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .login-title em {
      font-style: italic;
      color: #C4612F;
    }

    .login-subtitle {
      font-size: 15px;
      color: #5C635D;
      font-weight: 300;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-label {
      font-size: 14px;
      font-weight: 500;
      color: #1F2421;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      color: #5C635D;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      color: #1F2421;
      background: #FFFFFF;
      border: 1px solid #E7E1D7;
      border-radius: 8px;
      transition: all 0.3s ease;
      outline: none;
    }

    .form-input:focus {
      border-color: #C4612F;
      box-shadow: 0 0 0 3px rgba(196, 97, 47, 0.1);
    }

    .form-input::placeholder {
      color: #5C635D;
      opacity: 0.6;
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .checkbox-wrapper input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #C4612F;
    }

    .checkbox-label {
      font-size: 14px;
      color: #5C635D;
      cursor: pointer;
      user-select: none;
    }

    .forgot-link {
      font-size: 14px;
      color: #C4612F;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .forgot-link:hover {
      color: #A94E22;
    }

    .login-button {
      width: 100%;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 500;
      color: #FFFFFF;
      background: #C4612F;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 12px;
      font-family: 'Inter', sans-serif;
    }

    .login-button:hover {
      background: #A94E22;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(196, 97, 47, 0.3);
    }

    .login-button:active {
      transform: translateY(0);
    }

    .divider {
      margin: 32px 0;
      text-align: center;
      position: relative;
    }

    .divider::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 1px;
      background: #E7E1D7;
    }

    .divider-text {
      position: relative;
      display: inline-block;
      padding: 0 16px;
      background: #F7F4EF;
      font-size: 13px;
      color: #5C635D;
    }

    .secondary-actions {
      text-align: center;
      font-size: 14px;
      color: #5C635D;
    }

    .secondary-link {
      color: #C4612F;
      text-decoration: none;
      font-weight: 500;
      margin-left: 4px;
    }

    .secondary-link:hover {
      text-decoration: underline;
    }

    /* 响应式 */
    @media (max-width: 968px) {
      .login-container {
        flex-direction: column;
      }

      .brand-section {
        flex: 0 0 auto;
        min-height: 300px;
        padding: 40px 30px;
      }

      .visual-element {
        display: none;
      }

      .login-section {
        flex: 1;
        padding: 40px 30px;
      }

      .brand-title {
        font-size: 32px;
      }

      .login-title {
        font-size: 28px;
      }
    }

    @media (max-width: 640px) {
      .brand-section {
        padding: 30px 20px;
      }

      .login-section {
        padding: 30px 20px;
      }

      .login-card {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <!-- 左侧品牌区 -->
    <div class="brand-section">
      <div class="brand-content">
        <div class="logo-area">
          <div class="logo">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/>
            </svg>
          </div>
          <h1 class="brand-title">IETM <em>系统</em></h1>
          <p class="brand-subtitle">智能交互式电子技术手册系统</p>
        </div>

        <div class="visual-element">
          <div class="feature-pills">
            <div class="feature-pill">
              <span class="feature-icon"></span>
              <span>智能化技术文档管理</span>
            </div>
            <div class="feature-pill">
              <span class="feature-icon"></span>
              <span>交互式故障诊断</span>
            </div>
            <div class="feature-pill">
              <span class="feature-icon"></span>
              <span>多端协同访问</span>
            </div>
            <div class="feature-pill">
              <span class="feature-icon"></span>
              <span>全生命周期追踪</span>
            </div>
          </div>
        </div>
      </div>

      <div class="brand-footer">
        <p>© 2026 IETM System. Version 2.0</p>
      </div>
    </div>

    <!-- 右侧登录区 -->
    <div class="login-section">
      <div class="login-card">
        <div class="login-header">
          <span class="eyebrow">Secure Access</span>
          <h2 class="login-title">欢迎<em>回来</em></h2>
          <p class="login-subtitle">登录您的账号以继续访问系统</p>
        </div>

        <form class="login-form" onsubmit="event.preventDefault(); alert('这是原型图演示');">
          <div class="form-group">
            <label class="form-label" for="username">账号</label>
            <div class="input-wrapper">
              <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
              <input
                type="text"
                id="username"
                class="form-input"
                placeholder="请输入您的账号"
                value="admin"
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">密码</label>
            <div class="input-wrapper">
              <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
              <input
                type="password"
                id="password"
                class="form-input"
                placeholder="请输入您的密码"
                value="••••••••"
              />
            </div>
          </div>

          <div class="form-options">
            <div class="checkbox-wrapper">
              <input type="checkbox" id="remember" checked />
              <label class="checkbox-label" for="remember">记住我</label>
            </div>
            <a href="#" class="forgot-link" onclick="event.preventDefault(); alert('找回密码功能');">忘记密码?</a>
          </div>

          <button type="submit" class="login-button">登录系统</button>
        </form>

        <div class="divider">
          <span class="divider-text">或</span>
        </div>

        <div class="secondary-actions">
          <span>还没有账号?</span>
          <a href="#" class="secondary-link" onclick="event.preventDefault(); alert('注册功能');">申请账号</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 简单的交互演示
    document.querySelectorAll('.form-input').forEach(input => {
      input.addEventListener('focus', function() {
        this.parentElement.style.transform = 'scale(1.01)';
      });

      input.addEventListener('blur', function() {
        this.parentElement.style.transform = 'scale(1)';
      });
    });
  </script>
</body>
</html>
