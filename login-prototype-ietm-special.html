<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IETM系统登录 - 武器装备交互式电子技术手册</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Chinese Quote", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: rgba(0, 0, 0, 0.85);
      height: 100vh;
      overflow: hidden;
    }

    #userLayout {
      height: 100%;
      width: 100%;
      background: #0a0e27;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .bg-layers {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .gradient-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(24, 144, 255, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(82, 196, 26, 0.1) 0%, transparent 50%),
        linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1629 100%);
    }

    /* 技术蓝图网格 */
    .blueprint-grid {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(rgba(24, 144, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(24, 144, 255, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridMove 25s linear infinite;
    }

    @keyframes gridMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(40px, 40px); }
    }

    /* IETM装备线框图装饰 */
    .equipment-wireframe {
      position: absolute;
      width: 280px;
      height: 280px;
      opacity: 0.08;
      animation: rotate3d 30s linear infinite;
    }

    .equipment-wireframe.left {
      left: 5%;
      top: 20%;
    }

    .equipment-wireframe.right {
      right: 5%;
      bottom: 15%;
      animation-direction: reverse;
    }

    @keyframes rotate3d {
      from { transform: rotateY(0deg) rotateX(15deg); }
      to { transform: rotateY(360deg) rotateX(15deg); }
    }

    .scan-line {
      position: absolute;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, rgba(24, 144, 255, 0.8) 50%, transparent 100%);
      box-shadow: 0 0 10px rgba(24, 144, 255, 0.8);
      animation: scan 5s linear infinite;
    }

    @keyframes scan {
      0% { top: -2px; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: rgba(24, 144, 255, 0.6);
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(24, 144, 255, 0.8);
    }

    .particle:nth-child(1) { left: 15%; animation: float1 7s infinite; }
    .particle:nth-child(2) { left: 30%; animation: float2 9s infinite; }
    .particle:nth-child(3) { left: 45%; animation: float1 8s infinite; }
    .particle:nth-child(4) { left: 60%; animation: float2 10s infinite; }
    .particle:nth-child(5) { left: 75%; animation: float1 7.5s infinite; }
    .particle:nth-child(6) { left: 85%; animation: float2 8.5s infinite; }

    @keyframes float1 {
      0%, 100% { top: 100%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: -10%; }
    }

    @keyframes float2 {
      0%, 100% { bottom: 100%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { bottom: -10%; }
    }

    .container {
      width: 100%;
      min-height: 100vh;
      padding: 60px 20px 90px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .top {
      text-align: center;
      margin-bottom: 45px;
    }

    .header {
      margin-bottom: 24px;
    }

    .header a {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 20px;
    }

    .logo-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .logo-glow-outer {
      position: absolute;
      width: 90px;
      height: 90px;
      background: radial-gradient(circle, rgba(24, 144, 255, 0.3) 0%, transparent 70%);
      border-radius: 50%;
      animation: pulseOuter 3s infinite;
    }

    .logo-glow-inner {
      position: absolute;
      width: 70px;
      height: 70px;
      background: radial-gradient(circle, rgba(24, 144, 255, 0.5) 0%, transparent 70%);
      border-radius: 50%;
      animation: pulseInner 2s infinite;
    }

    @keyframes pulseOuter {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    @keyframes pulseInner {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 0.8; }
    }

    .logo-gear {
      position: absolute;
      width: 85px;
      height: 85px;
      animation: rotateGear 15s linear infinite;
    }

    @keyframes rotateGear {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .logo {
      width: 64px;
      height: 64px;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 0 20px rgba(24, 144, 255, 0.8));
      animation: logoFloat 3s ease-in-out infinite;
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 48px;
      color: #ffffff;
      font-weight: 900;
      letter-spacing: 6px;
      text-shadow:
        0 0 10px rgba(24, 144, 255, 0.8),
        0 0 20px rgba(24, 144, 255, 0.6),
        0 0 30px rgba(24, 144, 255, 0.4);
    }

    .desc {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.9);
      margin-top: 16px;
      letter-spacing: 2px;
    }

    .subtitle {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      color: rgba(24, 144, 255, 0.8);
      margin-top: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .main {
      width: 480px;
      max-width: 90%;
      position: relative;
    }

    .card-border {
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(135deg,
        rgba(24, 144, 255, 0.5) 0%,
        rgba(82, 196, 26, 0.3) 50%,
        rgba(24, 144, 255, 0.5) 100%);
      border-radius: 10px;
      animation: borderGlow 3s linear infinite;
    }

    @keyframes borderGlow {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .card-corners {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .corner {
      position: absolute;
      width: 24px;
      height: 24px;
      border: 2px solid #1890FF;
    }

    .corner-tl { top: -2px; left: -2px; border-right: none; border-bottom: none; }
    .corner-tr { top: -2px; right: -2px; border-left: none; border-bottom: none; }
    .corner-bl { bottom: -2px; left: -2px; border-right: none; border-top: none; }
    .corner-br { bottom: -2px; right: -2px; border-left: none; border-top: none; }

    .user-layout-login {
      position: relative;
      background: rgba(10, 20, 40, 0.90);
      backdrop-filter: blur(20px);
      padding: 48px 45px;
      border-radius: 8px;
      box-shadow:
        0 0 40px rgba(24, 144, 255, 0.3),
        inset 0 0 60px rgba(24, 144, 255, 0.05);
      border: 1px solid rgba(24, 144, 255, 0.3);
    }

    .login-header {
      text-align: center;
      margin-bottom: 36px;
      padding-bottom: 28px;
      border-bottom: 1px solid rgba(24, 144, 255, 0.2);
      position: relative;
    }

    .login-header::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #1890FF, transparent);
      box-shadow: 0 0 10px #1890FF;
    }

    .login-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 10px;
      letter-spacing: 3px;
      text-shadow: 0 0 10px rgba(24, 144, 255, 0.5);
    }

    .login-subtitle {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 1px;
    }

    .form-item {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 10px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .form-input {
      width: 100%;
      height: 46px;
      padding: 4px 11px 4px 46px;
      font-size: 14px;
      color: #ffffff;
      background: rgba(24, 144, 255, 0.05);
      border: 1px solid rgba(24, 144, 255, 0.3);
      border-radius: 4px;
      transition: all 0.3s;
      backdrop-filter: blur(10px);
    }

    .form-input:hover {
      border-color: rgba(24, 144, 255, 0.6);
      background: rgba(24, 144, 255, 0.1);
    }

    .form-input:focus {
      border-color: #1890FF;
      outline: 0;
      box-shadow:
        0 0 0 2px rgba(24, 144, 255, 0.2),
        inset 0 0 20px rgba(24, 144, 255, 0.1);
      background: rgba(24, 144, 255, 0.15);
    }

    .form-input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .input-prefix {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(24, 144, 255, 0.6);
      font-size: 18px;
      transition: all 0.3s;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper:focus-within .input-prefix {
      color: #1890FF;
      filter: drop-shadow(0 0 4px rgba(24, 144, 255, 0.8));
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #1890FF;
      filter: drop-shadow(0 0 4px rgba(24, 144, 255, 0.5));
    }

    .checkbox-label {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      user-select: none;
    }

    .forgot-link {
      font-size: 13px;
      color: #1890FF;
      text-decoration: none;
      transition: all 0.3s;
      text-shadow: 0 0 10px rgba(24, 144, 255, 0.3);
    }

    .forgot-link:hover {
      color: #40a9ff;
      text-shadow: 0 0 15px rgba(24, 144, 255, 0.6);
    }

    .login-button {
      width: 100%;
      height: 50px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #fff;
      background: linear-gradient(135deg, #1890FF 0%, #096dd9 100%);
      border: 1px solid #1890FF;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow:
        0 4px 15px rgba(24, 144, 255, 0.4),
        inset 0 0 20px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      text-transform: uppercase;
    }

    .login-button::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        45deg,
        transparent 30%,
        rgba(255, 255, 255, 0.3) 50%,
        transparent 70%
      );
      transform: rotate(45deg);
      animation: buttonShine 3s infinite;
    }

    @keyframes buttonShine {
      0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
      100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
    }

    .login-button:hover {
      transform: translateY(-3px);
      box-shadow:
        0 6px 25px rgba(24, 144, 255, 0.6),
        inset 0 0 30px rgba(255, 255, 255, 0.2);
    }

    .login-button:active {
      transform: translateY(-1px);
    }

    /* IETM特色功能标签 */
    .features {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 34px;
      padding-top: 30px;
      border-top: 1px solid rgba(24, 144, 255, 0.2);
    }

    .feature-tag {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 14px;
      background: rgba(24, 144, 255, 0.08);
      border: 1px solid rgba(24, 144, 255, 0.3);
      border-radius: 6px;
      transition: all 0.3s;
    }

    .feature-tag:hover {
      background: rgba(24, 144, 255, 0.15);
      border-color: #1890FF;
      box-shadow: 0 0 20px rgba(24, 144, 255, 0.4);
      transform: translateY(-3px);
    }

    .feature-icon-wrapper {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(24, 144, 255, 0.2);
      border-radius: 50%;
      border: 2px solid rgba(24, 144, 255, 0.4);
    }

    .feature-icon {
      width: 20px;
      height: 20px;
      color: #1890FF;
      filter: drop-shadow(0 0 4px rgba(24, 144, 255, 0.6));
    }

    .feature-name {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .feature-desc {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      text-align: center;
      line-height: 1.4;
    }

    .footer {
      position: absolute;
      width: 100%;
      bottom: 0;
      padding: 24px 16px;
      text-align: center;
      z-index: 1;
    }

    .links {
      margin-bottom: 12px;
      font-size: 13px;
    }

    .links a {
      color: rgba(24, 144, 255, 0.7);
      text-decoration: none;
      transition: all 0.3s;
    }

    .links a:not(:last-child) {
      margin-right: 32px;
    }

    .links a:hover {
      color: #1890FF;
      text-shadow: 0 0 10px rgba(24, 144, 255, 0.8);
    }

    .copyright {
      color: rgba(255, 255, 255, 0.4);
      font-size: 12px;
    }

    @media (max-width: 768px) {
      .container {
        padding: 40px 16px 80px;
      }

      .main {
        width: 100%;
      }

      .title {
        font-size: 36px;
      }

      .user-layout-login {
        padding: 36px 28px;
      }

      .features {
        grid-template-columns: 1fr;
      }

      .equipment-wireframe {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="userLayout">
    <!-- 多层背景效果 -->
    <div class="bg-layers">
      <div class="gradient-bg"></div>
      <div class="blueprint-grid"></div>
      <div class="scan-line"></div>

      <!-- IETM装备线框装饰 -->
      <svg class="equipment-wireframe left" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <rect x="50" y="40" width="100" height="120" fill="none" stroke="#1890FF" stroke-width="1"/>
        <circle cx="100" cy="60" r="15" fill="none" stroke="#1890FF" stroke-width="1"/>
        <line x1="100" y1="75" x2="100" y2="100" stroke="#1890FF" stroke-width="1"/>
        <rect x="70" y="100" width="60" height="40" fill="none" stroke="#1890FF" stroke-width="1"/>
        <line x1="85" y1="140" x2="85" y2="160" stroke="#1890FF" stroke-width="1"/>
        <line x1="115" y1="140" x2="115" y2="160" stroke="#1890FF" stroke-width="1"/>
        <circle cx="85" cy="165" r="5" fill="none" stroke="#1890FF" stroke-width="1"/>
        <circle cx="115" cy="165" r="5" fill="none" stroke="#1890FF" stroke-width="1"/>
        <polyline points="50,80 30,80 30,120 50,120" fill="none" stroke="#1890FF" stroke-width="1"/>
        <polyline points="150,80 170,80 170,120 150,120" fill="none" stroke="#1890FF" stroke-width="1"/>
      </svg>

      <svg class="equipment-wireframe right" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <polygon points="100,30 140,60 140,110 100,140 60,110 60,60" fill="none" stroke="#1890FF" stroke-width="1"/>
        <circle cx="100" cy="85" r="25" fill="none" stroke="#1890FF" stroke-width="1"/>
        <line x1="75" y1="85" x2="125" y2="85" stroke="#1890FF" stroke-width="1"/>
        <line x1="100" y1="60" x2="100" y2="110" stroke="#1890FF" stroke-width="1"/>
        <rect x="85" y="140" width="30" height="30" fill="none" stroke="#1890FF" stroke-width="1"/>
        <line x1="100" y1="110" x2="100" y2="140" stroke="#1890FF" stroke-width="1"/>
      </svg>

      <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
      </div>
    </div>

    <div class="container">
      <div class="top">
        <div class="header">
          <a href="/">
            <div class="logo-wrapper">
              <div class="logo-glow-outer"></div>
              <div class="logo-glow-inner"></div>

              <!-- 旋转齿轮 -->
              <svg class="logo-gear" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M50,10 L55,20 L65,18 L67,28 L77,30 L75,40 L85,45 L80,55 L88,62 L80,68 L85,78 L75,80 L77,90 L67,88 L65,98 L55,96 L50,106 L45,96 L35,98 L33,88 L23,86 L25,76 L15,71 L20,61 L12,54 L20,48 L15,38 L25,36 L23,26 L33,28 L35,18 L45,20 Z"
                      fill="none" stroke="rgba(24, 144, 255, 0.3)" stroke-width="1.5"/>
              </svg>

              <svg class="logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#1890FF;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#096dd9;stop-opacity:1" />
                  </linearGradient>
                </defs>
                <rect width="64" height="64" rx="12" fill="url(#logoGrad)" opacity="0.9"/>
                <path d="M16 16h32v32H16z" fill="none" stroke="#fff" stroke-width="3"/>
                <path d="M24 32h16v16H16z" fill="#fff"/>
                <circle cx="32" cy="24" r="4" fill="#fff"/>
                <line x1="32" y1="12" x2="32" y2="16" stroke="#fff" stroke-width="2"/>
                <line x1="32" y1="48" x2="32" y2="52" stroke="#fff" stroke-width="2"/>
                <line x1="12" y1="32" x2="16" y2="32" stroke="#fff" stroke-width="2"/>
                <line x1="48" y1="32" x2="52" y2="32" stroke="#fff" stroke-width="2"/>
              </svg>
            </div>
            <span class="title">IETM</span>
          </a>
        </div>
        <div class="desc">武器装备交互式电子技术手册研发平台</div>
        <div class="subtitle">Interactive Electronic Technical Manual</div>
      </div>

      <div class="main">
        <div class="card-border"></div>
        <div class="card-corners">
          <div class="corner corner-tl"></div>
          <div class="corner corner-tr"></div>
          <div class="corner corner-bl"></div>
          <div class="corner corner-br"></div>
        </div>

        <form class="user-layout-login" onsubmit="event.preventDefault(); handleLogin();">
          <div class="login-header">
            <h2 class="login-title">SYSTEM LOGIN</h2>
            <p class="login-subtitle">欢迎使用IETM技术手册系统</p>
          </div>

          <div class="form-item">
            <label class="form-label">Account</label>
            <div class="input-wrapper">
              <span class="input-prefix">
                <svg viewBox="64 64 896 896" width="1em" height="1em" fill="currentColor">
                  <path d="M858.5 763.6a374 374 0 00-80.6-119.5 375.63 375.63 0 00-119.5-80.6c-.4-.2-.8-.3-1.2-.5C719.5 518 760 444.7 760 362c0-137-111-248-248-248S264 225 264 362c0 82.7 40.5 156 102.8 201.1-.4.2-.8.3-1.2.5-44.8 18.9-85 46-119.5 80.6a375.63 375.63 0 00-80.6 119.5A371.7 371.7 0 00136 901.8a8 8 0 008 8.2h60c4.4 0 7.9-3.5 8-7.8 2-77.2 33-149.5 87.8-204.3 56.7-56.7 132-87.9 212.2-87.9s155.5 31.2 212.2 87.9C779 752.7 810 825 812 902.2c.1 4.4 3.6 7.8 8 7.8h60a8 8 0 008-8.2c-1-47.8-10.9-94.3-29.5-138.2zM512 534c-45.9 0-89.1-17.9-121.6-50.4S340 407.9 340 362c0-45.9 17.9-89.1 50.4-121.6S466.1 190 512 190s89.1 17.9 121.6 50.4S684 316.1 684 362c0 45.9-17.9 89.1-50.4 121.6S557.9 534 512 534z"></path>
                </svg>
              </span>
              <input type="text" class="form-input" placeholder="请输入账号" value="admin" id="username" />
            </div>
          </div>

          <div class="form-item">

  <script>
    function handleLogin() {
      const btn = document.getElementById('loginBtn');
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (!username) {
        alert('请输入账号');
        return;
      }

      if (!password) {
        alert('请输入密码');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span style="opacity:0.7">Logging in...</span>';

      setTimeout(() => {
        alert('登录成功！\n即将跳转到系统主页...');
        btn.disabled = false;
        btn.textContent = 'Login System';
      }, 1500);
    }

    document.addEventListener('keyup', function(e) {
      if (e.key === 'Enter') {
        handleLogin();
      }
    });
  </script>
