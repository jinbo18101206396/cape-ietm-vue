<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IETM系统登录 - JeecgBoot风格</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Chinese Quote", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: rgba(0, 0, 0, 0.85);
      height: 100vh;
      overflow: hidden;
    }

    /* 背景容器 */
    #userLayout {
      height: 100%;
      width: 100%;
      background: #f0f2f5 url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTQ0MCIgaGVpZ2h0PSI3MjAiIHZpZXdCb3g9IjAgMCAxNDQwIDcyMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KICA8ZGVmcz4KICAgIDxsaW5lYXJHcmFkaWVudCBpZD0iZ3JhZDEiIHgxPSIwJSIgeTE9IjAlIiB4Mj0iMTAwJSIgeTI9IjEwMCUiPgogICAgICA8c3RvcCBvZmZzZXQ9IjAlIiBzdHlsZT0ic3RvcC1jb2xvcjojMTg5MEZGO3N0b3Atb3BhY2l0eTowLjEiLz4KICAgICAgPHN0b3Agb2Zmc2V0PSIxMDAlIiBzdHlsZT0ic3RvcC1jb2xvcjojNTJjNDFhO3N0b3Atb3BhY2l0eTowLjA1Ii8+CiAgICA8L2xpbmVhckdyYWRpZW50PgogIDwvZGVmcz4KICA8cmVjdCB3aWR0aD0iMTQ0MCIgaGVpZ2h0PSI3MjAiIGZpbGw9InVybCgjZ3JhZDEpIi8+Cjwvc3ZnPg==') no-repeat 50%;
      background-size: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .container {
      width: 100%;
      min-height: 100vh;
      padding: 110px 0 144px;
      position: relative;
    }

    /* 顶部Logo区域 */
    .top {
      text-align: center;
      margin-bottom: 40px;
    }

    .header {
      height: 44px;
      line-height: 44px;
      margin-bottom: 12px;
    }

    .header a {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    .logo {
      height: 44px;
      margin-right: 16px;
      vertical-align: top;
    }

    .title {
      font-size: 33px;
      color: rgba(0, 0, 0, 0.85);
      font-weight: 600;
      position: relative;
      top: 2px;
    }

    .desc {
      font-size: 20px;
      color: rgba(0, 0, 0, 0.45);
      margin-top: 12px;
    }

    /* 主登录区域 */
    .main {
      min-width: 260px;
      width: 368px;
      margin: 0 auto;
    }

    .user-layout-login {
      background: white;
      padding: 32px 32px 24px;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.09);
    }

    /* 表单样式 */
    .form-item {
      margin-bottom: 24px;
    }

    .form-input {
      width: 100%;
      height: 40px;
      padding: 4px 11px;
      padding-left: 40px;
      font-size: 14px;
      line-height: 1.5;
      color: rgba(0, 0, 0, 0.85);
      background-color: #fff;
      background-image: none;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      transition: all 0.3s;
      position: relative;
    }

    .form-input:hover {
      border-color: #40a9ff;
    }

    .form-input:focus {
      border-color: #40a9ff;
      outline: 0;
      box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
    }

    .form-input::placeholder {
      color: rgba(0, 0, 0, 0.25);
    }

    .input-prefix {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(0, 0, 0, 0.25);
      font-size: 14px;
    }

    .input-wrapper {
      position: relative;
    }

    /* 记住密码和忘记密码 */
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .checkbox {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #1890FF;
    }

    .checkbox-label {
      font-size: 14px;
      color: rgba(0, 0, 0, 0.65);
      cursor: pointer;
      user-select: none;
    }

    .forgot-link {
      font-size: 14px;
      color: #1890FF;
      text-decoration: none;
    }

    .forgot-link:hover {
      color: #40a9ff;
    }

    /* 登录按钮 */
    .login-button {
      width: 100%;
      height: 40px;
      font-size: 16px;
      font-weight: 400;
      color: #fff;
      background-color: #1890FF;
      border: 1px solid #1890FF;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
      line-height: 38px;
      padding: 0;
    }

    .login-button:hover {
      background-color: #40a9ff;
      border-color: #40a9ff;
    }

    .login-button:active {
      background-color: #096dd9;
      border-color: #096dd9;
    }

    .login-button:disabled {
      background-color: #f5f5f5;
      border-color: #d9d9d9;
      color: rgba(0, 0, 0, 0.25);
      cursor: not-allowed;
    }

    /* 底部 */
    .footer {
      position: absolute;
      width: 100%;
      bottom: 0;
      padding: 0 16px;
      margin: 48px 0 24px;
      text-align: center;
    }

    .links {
      margin-bottom: 8px;
      font-size: 14px;
    }

    .links a {
      color: rgba(0, 0, 0, 0.45);
      text-decoration: none;
      transition: all 0.3s;
    }

    .links a:not(:last-child) {
      margin-right: 40px;
    }

    .links a:hover {
      color: #1890FF;
    }

    .copyright {
      color: rgba(0, 0, 0, 0.45);
      font-size: 14px;
    }

    .copyright a {
      color: rgba(0, 0, 0, 0.45);
      text-decoration: none;
    }

    .copyright a:hover {
      color: #1890FF;
    }

    /* 图标样式 */
    .anticon {
      display: inline-block;
      color: inherit;
      font-style: normal;
      line-height: 0;
      text-align: center;
      text-transform: none;
      vertical-align: -0.125em;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .container {
        padding: 60px 16px 100px;
      }

      .main {
        width: 98%;
        max-width: 368px;
      }

      .desc {
        font-size: 16px;
      }

      .user-layout-login {
        padding: 24px 20px 20px;
      }
    }
  </style>
</head>
<body>
  <div id="userLayout" class="user-layout-wrapper">
    <div class="container">
      <div class="top">
        <div class="header">
          <a href="/">
            <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDQiIGhlaWdodD0iNDQiIHZpZXdCb3g9IjAgMCA0NCA0NCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KICA8cmVjdCB3aWR0aD0iNDQiIGhlaWdodD0iNDQiIHJ4PSI0IiBmaWxsPSIjMTg5MEZGIi8+CiAgPHBhdGggZD0iTTEyIDEyaDIwdjIwSDEyeiIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIiLz4KICA8cGF0aCBkPSJNMTggMjJoMTJ2MTBIMTB6IiBmaWxsPSIjZmZmIi8+Cjwvc3ZnPg==" class="logo" alt="logo" />
            <span class="title">IETM</span>
          </a>
        </div>
        <div class="desc">武器装备交互式电子技术手册研发平台</div>
      </div>

      <div class="main">
        <form class="user-layout-login" onsubmit="event.preventDefault(); handleLogin();">
          <div class="form-item">
            <div class="input-wrapper">
              <span class="input-prefix anticon">
                <svg viewBox="64 64 896 896" width="1em" height="1em" fill="currentColor">
                  <path d="M858.5 763.6a374 374 0 00-80.6-119.5 375.63 375.63 0 00-119.5-80.6c-.4-.2-.8-.3-1.2-.5C719.5 518 760 444.7 760 362c0-137-111-248-248-248S264 225 264 362c0 82.7 40.5 156 102.8 201.1-.4.2-.8.3-1.2.5-44.8 18.9-85 46-119.5 80.6a375.63 375.63 0 00-80.6 119.5A371.7 371.7 0 00136 901.8a8 8 0 008 8.2h60c4.4 0 7.9-3.5 8-7.8 2-77.2 33-149.5 87.8-204.3 56.7-56.7 132-87.9 212.2-87.9s155.5 31.2 212.2 87.9C779 752.7 810 825 812 902.2c.1 4.4 3.6 7.8 8 7.8h60a8 8 0 008-8.2c-1-47.8-10.9-94.3-29.5-138.2zM512 534c-45.9 0-89.1-17.9-121.6-50.4S340 407.9 340 362c0-45.9 17.9-89.1 50.4-121.6S466.1 190 512 190s89.1 17.9 121.6 50.4S684 316.1 684 362c0 45.9-17.9 89.1-50.4 121.6S557.9 534 512 534z"></path>
                </svg>
              </span>
              <input
                type="text"
                class="form-input"
                placeholder="请输入帐户名 / admin"
                value="admin"
                id="username"
              />
            </div>
          </div>

          <div class="form-item">
            <div class="input-wrapper">
              <span class="input-prefix anticon">
                <svg viewBox="64 64 896 896" width="1em" height="1em" fill="currentColor">
                  <path d="M832 464h-68V240c0-70.7-57.3-128-128-128H388c-70.7 0-128 57.3-128 128v224h-68c-17.7 0-32 14.3-32 32v384c0 17.7 14.3 32 32 32h640c17.7 0 32-14.3 32-32V496c0-17.7-14.3-32-32-32zM332 240c0-30.9 25.1-56 56-56h248c30.9 0 56 25.1 56 56v224H332V240zm460 600H232V536h560v304zM484 701v53c0 4.4 3.6 8 8 8h40c4.4 0 8-3.6 8-8v-53a48.01 48.01 0 10-56 0z"></path>
                </svg>
              </span>
              <input
                type="password"
                class="form-input"
                placeholder="请输入密码 / 123456"
                value="123456"
                id="password"
              />
            </div>
          </div>

          <div class="form-options">
            <div class="checkbox-wrapper">
              <input type="checkbox" id="remember" class="checkbox" checked />
              <label for="remember" class="checkbox-label">记住我</label>
            </div>
            <a href="#" class="forgot-link" onclick="event.preventDefault(); alert('忘记密码功能');">忘记密码?</a>
          </div>

          <button type="submit" class="login-button" id="loginBtn">
            确定
          </button>
        </form>
      </div>

      <div class="footer">
        <div class="links">
          <a href="#" onclick="event.preventDefault();">帮助</a>
          <a href="#" onclick="event.preventDefault();">隐私</a>
          <a href="#" onclick="event.preventDefault();">条款</a>
        </div>
        <div class="copyright">
          Copyright &copy; 2026
          <a href="#" onclick="event.preventDefault();">中国航空综合技术研究所 | 版权所有</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    function handleLogin() {
      const btn = document.getElementById('loginBtn');
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (!username) {
        alert('请输入账号');
        return;
      }

      if (!password) {
        alert('请输入密码');
        return;
      }

      btn.disabled = true;
      btn.textContent = '登录中...';

      setTimeout(() => {
        alert('这是原型图演示\n登录成功将跳转到 /dashboard/analysis');
        btn.disabled = false;
        btn.textContent = '确定';
      }, 1000);
    }

    // 输入框焦点效果
    document.querySelectorAll('.form-input').forEach(input => {
      input.addEventListener('focus', function() {
        this.style.borderColor = '#40a9ff';
        this.style.boxShadow = '0 0 0 2px rgba(24, 144, 255, 0.2)';
      });

      input.addEventListener('blur', function() {
        this.style.borderColor = '#d9d9d9';
        this.style.boxShadow = 'none';
      });
    });

    // 回车登录
    document.addEventListener('keyup', function(e) {
      if (e.key === 'Enter') {
        handleLogin();
      }
    });
  </script>
</body>
</html>
