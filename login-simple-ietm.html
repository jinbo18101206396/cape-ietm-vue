<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IETM系统登录</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Chinese Quote", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: rgba(0, 0, 0, 0.85);
      height: 100vh;
      overflow: hidden;
    }

    #userLayout {
      height: 100%;
      width: 100%;
      background: linear-gradient(135deg, #1a3a52 0%, #2c5364 50%, #1a5276 100%);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* 简洁背景装饰 */
    .bg-decoration {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      opacity: 0.08;
    }

    .bg-circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
    }

    .bg-circle:nth-child(1) {
      width: 500px;
      height: 500px;
      top: -200px;
      left: -150px;
    }

    .bg-circle:nth-child(2) {
      width: 350px;
      height: 350px;
      bottom: -100px;
      right: -80px;
    }

    /* 军工元素装饰 */
    .military-decoration {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .corner-mark {
      position: absolute;
      width: 60px;
      height: 60px;
      border: 2px solid rgba(255, 255, 255, 0.15);
    }

    .corner-mark.tl {
      top: 20px;
      left: 20px;
      border-right: none;
      border-bottom: none;
    }

    .corner-mark.tr {
      top: 20px;
      right: 20px;
      border-left: none;
      border-bottom: none;
    }

    .corner-mark.bl {
      bottom: 20px;
      left: 20px;
      border-right: none;
      border-top: none;
    }

    .corner-mark.br {
      bottom: 20px;
      right: 20px;
      border-left: none;
      border-top: none;
    }

    .shield-icon {
      position: absolute;
      opacity: 0.05;
      width: 200px;
      height: 200px;
    }

    .shield-icon.left {
      left: 8%;
      top: 25%;
    }

    .shield-icon.right {
      right: 8%;
      bottom: 20%;
    }

    /* 军事装备轮廓 */
    .military-silhouette {
      position: absolute;
      opacity: 0.08;
      fill: white;
    }

    .aircraft {
      width: 180px;
      height: 80px;
      right: 12%;
      top: 15%;
      animation: flyAcross 25s linear infinite;
    }

    @keyframes flyAcross {
      0% { transform: translateX(-100px); }
      100% { transform: translateX(100px); }
    }

    .carrier {
      width: 220px;
      height: 100px;
      left: 10%;
      bottom: 25%;
    }

    .satellite {
      width: 100px;
      height: 100px;
      right: 15%;
      top: 35%;
      animation: orbit 30s linear infinite;
    }

    @keyframes orbit {
      0% { transform: rotate(0deg) translateX(20px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(20px) rotate(-360deg); }
    }

    .tank {
      width: 160px;
      height: 80px;
      left: 8%;
      top: 45%;
    }

    .rocket {
      width: 60px;
      height: 140px;
      right: 10%;
      bottom: 30%;
    }

    .helicopter {
      width: 140px;
      height: 70px;
      left: 15%;
      top: 20%;
      animation: hover 6s ease-in-out infinite;
    }

    @keyframes hover {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .container {
      width: 100%;
      min-height: 100vh;
      padding: 110px 0 100px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 顶部Logo区域 */
    .top {
      text-align: center;
      margin-bottom: 40px;
    }

    .header {
      height: 44px;
      line-height: 44px;
      margin-bottom: 16px;
    }

    .header a {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      height: 44px;
      vertical-align: top;
    }

    .title {
      font-size: 33px;
      color: #ffffff;
      font-weight: 600;
      position: relative;
      top: 2px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .desc {
      font-size: 20px;
      color: rgba(255, 255, 255, 0.95);
      margin-top: 12px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }

    .subtitle {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      margin-top: 8px;
      letter-spacing: 1px;
    }

    /* 主登录区域 */
    .main {
      min-width: 260px;
      width: 400px;
      max-width: 90%;
    }

    .user-layout-login {
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid #f0f0f0;
    }

    .login-title {
      font-size: 22px;
      font-weight: 600;
      color: rgba(0, 0, 0, 0.85);
      margin-bottom: 8px;
    }

    .login-subtitle {
      font-size: 14px;
      color: rgba(0, 0, 0, 0.45);
    }

    /* 表单样式 */
    .form-item {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      color: rgba(0, 0, 0, 0.85);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .input-wrapper {
      position: relative;
    }

    .input-prefix {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(0, 0, 0, 0.25);
      font-size: 16px;
      z-index: 1;
    }

    .form-input {
      width: 100%;
      height: 40px;
      padding: 4px 11px 4px 40px;
      font-size: 14px;
      line-height: 1.5;
      color: rgba(0, 0, 0, 0.85);
      background-color: #fff;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      transition: all 0.3s;
      outline: none;
    }

    .form-input:hover {
      border-color: #40a9ff;
    }

    .form-input:focus {
      border-color: #40a9ff;
      box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
    }

    .form-input::placeholder {
      color: rgba(0, 0, 0, 0.25);
    }

    /* 选项 */
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .checkbox {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #1890FF;
    }

    .checkbox-label {
      font-size: 14px;
      color: rgba(0, 0, 0, 0.65);
      cursor: pointer;
      user-select: none;
    }

    .forgot-link {
      font-size: 14px;
      color: #1890FF;
      text-decoration: none;
      transition: color 0.3s;
    }

    .forgot-link:hover {
      color: #40a9ff;
    }

    /* 登录按钮 */
    .login-button {
      width: 100%;
      height: 40px;
      font-size: 16px;
      font-weight: 500;
      color: #fff;
      background-color: #1890FF;
      border: 1px solid #1890FF;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
      padding: 0;
    }

    .login-button:hover {
      background-color: #40a9ff;
      border-color: #40a9ff;
    }

    .login-button:active {
      background-color: #096dd9;
      border-color: #096dd9;
    }

    .login-button:disabled {
      background-color: #f5f5f5;
      border-color: #d9d9d9;
      color: rgba(0, 0, 0, 0.25);
      cursor: not-allowed;
    }

    /* IETM特性标签 */
    .features {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #f0f0f0;
    }

    .feature-tag {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #f0f9ff;
      border: 1px solid #bae7ff;
      border-radius: 4px;
      font-size: 13px;
      color: #1890FF;
      transition: all 0.3s;
    }

    .feature-tag:hover {
      background: #e6f7ff;
      box-shadow: 0 2px 8px rgba(24, 144, 255, 0.15);
      transform: translateY(-2px);
    }

    .feature-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* 底部 */
    .footer {
      position: absolute;
      width: 100%;
      bottom: 0;
      padding: 24px 16px;
      text-align: center;
      z-index: 1;
    }

    .links {
      margin-bottom: 8px;
      font-size: 14px;
    }

    .links a {
      color: rgba(255, 255, 255, 0.9);
      text-decoration: none;
      transition: all 0.3s;
    }

    .links a:not(:last-child) {
      margin-right: 40px;
    }

    .links a:hover {
      color: #ffffff;
    }

    .copyright {
      color: rgba(255, 255, 255, 0.75);
      font-size: 14px;
    }

    .copyright a {
      color: rgba(255, 255, 255, 0.75);
      text-decoration: none;
    }

    .copyright a:hover {
      color: #ffffff;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .container {
        padding: 60px 16px 100px;
      }

      .main {
        width: 98%;
        max-width: 400px;
      }

      .desc {
        font-size: 16px;
      }

      .user-layout-login {
        padding: 32px 24px;
      }

      .features {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="userLayout">
    <div class="bg-decoration">
      <div class="bg-circle"></div>
      <div class="bg-circle"></div>
    </div>

    <!-- 军工元素装饰 -->
    <div class="military-decoration">
      <div class="corner-mark tl"></div>

      <svg class="shield-icon left" viewBox="0 0 24 24" fill="white">

    <div class="container">
      <div class="top">
        <div class="header">
          <a href="/">

              <defs>
                <linearGradient id="militaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">

              </defs>
              <rect width="44" height="44" rx="4" fill="url(#militaryGrad)"/>

      </div>

      <div class="main">
        <form class="user-layout-login" onsubmit="event.preventDefault(); handleLogin();">
          <div class="login-header">
            <h2 class="login-title">用户登录</h2>
            <p class="login-subtitle">欢迎使用IETM系统</p>
          </div>

          <div class="form-item">
            <label class="form-label">账号</label>
            <div class="input-wrapper">

            <div class="feature-tag">
              <svg class="feature-icon" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>

  <script>
    function handleLogin() {
      const btn = document.getElementById('loginBtn');
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (!username) {
        alert('请输入账号');
        return;
      }

      if (!password) {
        alert('请输入密码');
        return;
      }

      btn.disabled = true;
      btn.textContent = '登录中...';

      setTimeout(() => {
        alert('登录成功！即将跳转到系统主页...');
        btn.disabled = false;
        btn.textContent = '确定';
      }, 1000);
    }

    document.addEventListener('keyup', function(e) {
      if (e.key === 'Enter') {
        handleLogin();
      }
    });
  </script>
