<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UEditor完整工具栏测试</title>
    <style>
        body {
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #333;
        }
        .test-info {
            background: #f0f0f0;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .test-info h3 {
            margin-top: 0;
        }
        #editor-container {
            margin-top: 20px;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 5px;
        }
        .error {
            background: #ffebee;
        }
    </style>
</head>
<body>
    <h1>UEditor完整工具栏测试页面</h1>

    <div class="test-info">
        <h3>测试说明</h3>
        <p>本页面用于验证UEditor的完整工具栏是否包含以下按钮：</p>
        <ul>
            <li>✅ date（日期）</li>
            <li>✅ time（时间）</li>
            <li>✅ spechars（特殊字符）</li>
            <li>✅ searchreplace（查询替换）</li>
            <li>✅ removeformat（清除格式）</li>
            <li>✅ selectall（全选）</li>
        </ul>
    </div>

    <div id="editor-container">
        <script id="editor" type="text/plain" style="width:100%;height:400px;"></script>
    </div>

    <div id="result" class="result" style="display:none;"></div>

    <!-- UEditor核心文件 -->
    <script src="/static/ueditor/ueditor.config.js"></script>
    <script src="/static/ueditor/ueditor.all.js"></script>
    <script src="/static/ueditor/lang/zh-cn/zh-cn.js"></script>

    <script>
        // 完整工具栏配置（与ueditorConfig.js中的fullToolbar一致）
        var fullToolbar = [
            [
                'source', '|',
                'undo', 'redo', '|',
                'bold', 'italic', 'underline', 'fontborder', 'strikethrough', 'superscript', 'subscript', '|',
                'forecolor', 'backcolor', 'insertorderedlist', 'insertunorderedlist', '|',
                'rowspacingtop', 'rowspacingbottom', 'lineheight', '|',
                'customstyle', 'paragraph', 'fontfamily', 'fontsize', '|',
                'directionalityltr', 'directionalityrtl', 'indent', '|',
                'justifyleft', 'justifycenter', 'justifyright', 'justifyjustify', '|',
                'touppercase', 'tolowercase', '|',
                'link', 'unlink', '|',
                'imagenone', 'imageleft', 'imageright', 'imagecenter', '|',
                'simpleupload', 'insertimage', 'emotion', 'scrawl', 'insertvideo', 'music', 'attachment', 'map', 'gmap', 'insertframe', 'insertcode', 'webapp', 'pagebreak', 'template', 'background', '|',
                'horizontal', 'date', 'time', 'spechars', 'snapscreen', 'wordimage', '|',
                'inserttable', 'deletetable', 'insertparagraphbeforetable', 'insertrow', 'deleterow', 'insertcol', 'deletecol', 'mergecells', 'mergeright', 'mergedown', 'splittocells', 'splittorows', 'splittocols', 'charts', '|',
                'print', 'preview', 'searchreplace', 'removeformat', 'selectall', 'cleardoc', 'drafts', 'help'
            ]
        ];

        // 初始化编辑器
        var ue = UE.getEditor('editor', {
            toolbars: fullToolbar,
            lang: 'zh-cn',
            initialFrameHeight: 400,
            autoHeightEnabled: false
        });

        // 编辑器就绪后检查
        ue.ready(function() {
            var resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';

            // 检查工具栏配置
            var toolbar = ue.options.toolbars[0];
            var results = [];

            results.push('<h3>工具栏配置检查结果</h3>');
            results.push('<p><strong>总按钮数：</strong>' + toolbar.length + '</p>');

            // 检查目标按钮
            var targetButtons = ['date', 'time', 'spechars', 'searchreplace', 'removeformat', 'selectall'];
            var found = [];
            var missing = [];

            targetButtons.forEach(function(btn) {
                if (toolbar.indexOf(btn) > -1) {
                    found.push(btn);
                } else {
                    missing.push(btn);
                }
            });

            results.push('<h4>✅ 已包含的按钮 (' + found.length + '/' + targetButtons.length + ')：</h4>');
            results.push('<ul>');
            found.forEach(function(btn) {
                results.push('<li style="color:green;"><strong>' + btn + '</strong></li>');
            });
            results.push('</ul>');

            if (missing.length > 0) {
                results.push('<h4 style="color:red;">❌ 缺失的按钮：</h4>');
                results.push('<ul>');
                missing.forEach(function(btn) {
                    results.push('<li style="color:red;"><strong>' + btn + '</strong></li>');
                });
                results.push('</ul>');
                resultDiv.className = 'result error';
            }

            // 检查命令是否已注册
            results.push('<h4>命令注册检查：</h4>');
            results.push('<ul>');
            targetButtons.forEach(function(btn) {
                var isRegistered = typeof UE.commands[btn] !== 'undefined';
                var status = isRegistered ? '✅ 已注册' : '❌ 未注册';
                var color = isRegistered ? 'green' : 'red';
                results.push('<li style="color:' + color + ';">' + btn + ': ' + status + '</li>');
            });
            results.push('</ul>');

            // 显示完整工具栏列表
            results.push('<h4>完整工具栏按钮列表：</h4>');
            results.push('<pre style="background:#f5f5f5;padding:10px;overflow:auto;max-height:200px;">' +
                JSON.stringify(toolbar, null, 2) + '</pre>');

            resultDiv.innerHTML = results.join('');
        });
    </script>
</body>
</html>
