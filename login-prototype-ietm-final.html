<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IETM系统登录 - 武器装备交互式电子技术手册</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Chinese Quote", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: rgba(0, 0, 0, 0.85);
      height: 100vh;
      overflow: hidden;
    }

    /* 主容器 */
    #userLayout {
      height: 100%;
      width: 100%;
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* 动态背景 */
    .bg-animation {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .tech-line {
      position: absolute;
      background: rgba(24, 144, 255, 0.1);
      height: 1px;
    }

    .tech-line:nth-child(1) {
      width: 40%;
      top: 20%;
      left: 0;
      animation: slideRight 8s infinite;
    }

    .tech-line:nth-child(2) {
      width: 60%;
      top: 40%;
      right: 0;
      animation: slideLeft 10s infinite;
    }

    .tech-line:nth-child(3) {
      width: 30%;
      top: 60%;
      left: 20%;
      animation: slideRight 12s infinite;
    }

    .tech-line:nth-child(4) {
      width: 50%;
      top: 80%;
      right: 10%;
      animation: slideLeft 9s infinite;
    }

    @keyframes slideRight {
      0%, 100% { transform: translateX(-100%); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateX(200%); }
    }

    @keyframes slideLeft {
      0%, 100% { transform: translateX(100%); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateX(-200%); }
    }

    .tech-dots {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .dot {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(24, 144, 255, 0.3);
      border-radius: 50%;
      animation: pulse 3s infinite;
    }

    .dot:nth-child(1) { top: 15%; left: 10%; animation-delay: 0s; }
    .dot:nth-child(2) { top: 25%; left: 80%; animation-delay: 0.5s; }
    .dot:nth-child(3) { top: 45%; left: 15%; animation-delay: 1s; }
    .dot:nth-child(4) { top: 65%; left: 85%; animation-delay: 1.5s; }
    .dot:nth-child(5) { top: 75%; left: 30%; animation-delay: 2s; }
    .dot:nth-child(6) { top: 35%; left: 60%; animation-delay: 2.5s; }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.5); }
    }

    .container {
      width: 100%;
      min-height: 100vh;
      padding: 80px 0 100px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* 顶部Logo区域 */
    .top {
      text-align: center;
      margin-bottom: 50px;
    }

    .header {
      margin-bottom: 20px;
    }

    .header a {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 16px;
    }

    .logo-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .logo-glow {
      position: absolute;
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, rgba(24, 144, 255, 0.3) 0%, transparent 70%);
      border-radius: 50%;
      animation: glow 2s infinite;
    }

    @keyframes glow {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 0.8; }
    }

    .logo {
      width: 56px;
      height: 56px;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 4px 12px rgba(24, 144, 255, 0.4));
    }

    .title {
      font-size: 36px;
      color: #ffffff;
      font-weight: 700;
      letter-spacing: 2px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .desc {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 16px;
      letter-spacing: 1px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }

    .subtitle {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 8px;
    }

    /* 主登录区域 */
    .main {
      width: 420px;
      max-width: 90%;
    }

    .user-layout-login {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 1px rgba(255, 255, 255, 0.5) inset;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid #f0f0f0;
    }

    .login-title {
      font-size: 24px;
      font-weight: 600;
      color: rgba(0, 0, 0, 0.85);
      margin-bottom: 8px;
    }

    .login-subtitle {
      font-size: 14px;
      color: rgba(0, 0, 0, 0.45);
    }

    /* 表单样式 */
    .form-item {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      color: rgba(0, 0, 0, 0.85);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .form-input {
      width: 100%;
      height: 42px;
      padding: 4px 11px;
      padding-left: 40px;
      font-size: 14px;
      line-height: 1.5;
      color: rgba(0, 0, 0, 0.85);
      background-color: #fff;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      transition: all 0.3s;
    }

    .form-input:hover {
      border-color: #40a9ff;
    }

    .form-input:focus {
      border-color: #1890FF;
      outline: 0;
      box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
    }

    .form-input::placeholder {
      color: rgba(0, 0, 0, 0.25);
    }

    .input-prefix {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(0, 0, 0, 0.25);
      font-size: 16px;
      transition: color 0.3s;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper:focus-within .input-prefix {
      color: #1890FF;
    }

    /* 选项 */
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .checkbox {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #1890FF;
    }

    .checkbox-label {
      font-size: 14px;
      color: rgba(0, 0, 0, 0.65);
      cursor: pointer;
      user-select: none;
    }

    .forgot-link {
      font-size: 14px;
      color: #1890FF;
      text-decoration: none;
      transition: color 0.3s;
    }

    .forgot-link:hover {
      color: #40a9ff;
    }

    /* 登录按钮 */
    .login-button {
      width: 100%;
      height: 44px;
      font-size: 16px;
      font-weight: 500;
      color: #fff;
      background: linear-gradient(135deg, #1890FF 0%, #096dd9 100%);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 2px 8px rgba(24, 144, 255, 0.3);
      position: relative;
      overflow: hidden;
    }

    .login-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s;
    }

    .login-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(24, 144, 255, 0.4);
    }

    .login-button:hover::before {
      left: 100%;
    }

    .login-button:active {
      transform: translateY(0);
    }

    .login-button:disabled {
      background: #f5f5f5;
      color: rgba(0, 0, 0, 0.25);
      cursor: not-allowed;
      box-shadow: none;
    }

    /* 特性标签 */
    .features {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #f0f0f0;
    }

    .feature-tag {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: linear-gradient(135deg, #f0f9ff 0%, #e6f7ff 100%);
      border-radius: 4px;
      font-size: 13px;
      color: #1890FF;
      border: 1px solid #bae7ff;
    }

    .feature-icon {
      width: 16px;
      height: 16px;
      color: #1890FF;
    }

    /* 底部 */
    .footer {
      position: absolute;
      width: 100%;
      bottom: 0;
      padding: 24px 16px;
      text-align: center;
      z-index: 1;
    }

    .links {
      margin-bottom: 12px;
      font-size: 14px;
    }

    .links a {
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      transition: all 0.3s;
    }

    .links a:not(:last-child) {
      margin-right: 32px;
    }

    .links a:hover {
      color: #ffffff;
    }

    .copyright {
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
    }

    .copyright a {
      color: rgba(255, 255, 255, 0.5);
      text-decoration: none;
    }

    .copyright a:hover {
      color: rgba(255, 255, 255, 0.8);
    }

    /* SVG图标 */
    .anticon {
      display: inline-block;
      color: inherit;
      font-style: normal;
      line-height: 0;
      text-align: center;
      text-transform: none;
      vertical-align: -0.125em;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .container {
        padding: 40px 16px 80px;
      }

      .main {
        width: 100%;
      }

      .title {
        font-size: 28px;
      }

      .desc {
        font-size: 16px;
      }

      .user-layout-login {
        padding: 32px 24px;
      }

      .features {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="userLayout">
    <!-- 动态背景 -->
    <div class="bg-animation">
      <div class="tech-line"></div>
      <div class="tech-line"></div>
      <div class="tech-line"></div>
      <div class="tech-line"></div>
      <div class="tech-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <div class="container">
      <div class="top">
        <div class="header">
          <a href="/">
            <div class="logo-wrapper">
              <div class="logo-glow"></div>
              <svg class="logo" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#1890FF;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#096dd9;stop-opacity:1" />
                  </linearGradient>
                </defs>
                <rect width="56" height="56" rx="8" fill="url(#logoGrad)"/>
                <path d="M14 14h28v28H14z" fill="none" stroke="#fff" stroke-width="2.5"/>
                <path d="M20 28h16v14H14z" fill="#fff"/>
                <circle cx="28" cy="21" r="3" fill="#fff"/>
              </svg>
            </div>
            <span class="title">IETM</span>
          </a>
        </div>
        <div class="desc">武器装备交互式电子技术手册研发平台</div>
        <div class="subtitle">Interactive Electronic Technical Manual</div>
      </div>

      <div class="main">
        <form class="user-layout-login" onsubmit="event.preventDefault(); handleLogin();">
          <div class="login-header">
            <h2 class="login-title">系统登录</h2>
            <p class="login-subtitle">欢迎使用IETM技术手册系统</p>
          </div>

          <div class="form-item">
            <label class="form-label">账号</label>
            <div class="input-wrapper">
              <span class="input-prefix anticon">
                <svg viewBox="64 64 896 896" width="1em" height="1em" fill="currentColor">
                  <path d="M858.5 763.6a374 374 0 00-80.6-119.5 375.63 375.63 0 00-119.5-80.6c-.4-.2-.8-.3-1.2-.5C719.5 518 760 444.7 760 362c0-137-111-248-248-248S264 225 264 362c0 82.7 40.5 156 102.8 201.1-.4.2-.8.3-1.2.5-44.8 18.9-85 46-119.5 80.6a375.63 375.63 0 00-80.6 119.5A371.7 371.7 0 00136 901.8a8 8 0 008 8.2h60c4.4 0 7.9-3.5 8-7.8 2-77.2 33-149.5 87.8-204.3 56.7-56.7 132-87.9 212.2-87.9s155.5 31.2 212.2 87.9C779 752.7 810 825 812 902.2c.1 4.4 3.6 7.8 8 7.8h60a8 8 0 008-8.2c-1-47.8-10.9-94.3-29.5-138.2zM512 534c-45.9 0-89.1-17.9-121.6-50.4S340 407.9 340 362c0-45.9 17.9-89.1 50.4-121.6S466.1 190 512 190s89.1 17.9 121.6 50.4S684 316.1 684 362c0 45.9-17.9 89.1-50.4 121.6S557.9 534 512 534z"></path>
                </svg>
              </span>
              <input
                type="text"
                class="form-input"
                placeholder="请输入账号"
                value="admin"
                id="username"
              />
            </div>
          </div>

          <div class="form-item">
            <label class="form-label">密码</label>
            <div class="input-wrapper">
              <span class="input-prefix anticon">
                <svg viewBox="64 64 896 896" width="1em" height="1em" fill="currentColor">
                  <path d="M832 464h-68V240c0-70.7-57.3-128-128-128H388c-70.7 0-128 57.3-128 128v224h-68c-17.7 0-32 14.3-32 32v384c0 17.7 14.3 32 32 32h640c17.7 0 32-14.3 32-32V496c0-17.7-14.3-32-32-32zM332 240c0-30.9 25.1-56 56-56h248c30.9 0 56 25.1 56 56v224H332V240zm460 600H232V536h560v304zM484 701v53c0 4.4 3.6 8 8 8h40c4.4 0 8-3.6 8-8v-53a48.01 48.01 0 10-56 0z"></path>
                </svg>
              </span>
              <input
                type="password"
                class="form-input"
                placeholder="请输入密码"
                value="123456"
                id="password"
              />
            </div>
          </div>

          <div class="form-options">
            <div class="checkbox-wrapper">
              <input type="checkbox" id="remember" class="checkbox" checked />
              <label for="remember" class="checkbox-label">记住密码</label>
            </div>
            <a href="#" class="forgot-link" onclick="event.preventDefault(); alert('忘记密码功能');">忘记密码?</a>
          </div>

          <button type="submit" class="login-button" id="loginBtn">
            登录系统
          </button>

          <div class="features">
            <div class="feature-tag">
              <svg class="feature-icon" fill="currentColor" viewBox="0 0 24 24">
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
              </svg>
              <span>智能检索</span>
            </div>
            <div class="feature-tag">
              <svg class="feature-icon" fill="currentColor" viewBox="0 0 24 24">
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
              </svg>
              <span>3D模型</span>
            </div>
            <div class="feature-tag">
              <svg class="feature-icon" fill="currentColor" viewBox="0 0 24 24">
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
              </svg>
              <span>故障诊断</span>
            </div>
            <div class="feature-tag">
              <svg class="feature-icon" fill="currentColor" viewBox="0 0 24 24">
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
              </svg>
              <span>多端协同</span>
            </div>
          </div>
        </form>
      </div>

      <div class="footer">
        <div class="links">
          <a href="#" onclick="event.preventDefault();">产品文档</a>
          <a href="#" onclick="event.preventDefault();">技术支持</a>
          <a href="#" onclick="event.preventDefault();">用户手册</a>
        </div>
        <div class="copyright">
          Copyright &copy; 2026 中国航空综合技术研究所 | 版权所有
        </div>
      </div>
    </div>
  </div>

  <script>
    function handleLogin() {
      const btn = document.getElementById('loginBtn');
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (!username) {
        alert('请输入账号');
        return;
      }

      if (!password) {
        alert('请输入密码');
        return;
      }

      btn.disabled = true;
      btn.textContent = '登录中...';

      setTimeout(() => {
        alert('登录成功！\n即将跳转到系统主页...');
        btn.disabled = false;
        btn.textContent = '登录系统';
      }, 1200);
    }

    document.addEventListener('keyup', function(e) {
      if (e.key === 'Enter') {
        handleLogin();
      }
    });
  </script>
</body>
</html>
