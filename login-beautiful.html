<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IETM系统登录</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Chinese Quote", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: rgba(0, 0, 0, 0.85);
      height: 100vh;
      overflow: hidden;
    }

    #userLayout {
      height: 100%;
      width: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* 优雅的背景装饰 */
    .bg-overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.08) 0%, transparent 50%);
    }

    .bg-grid {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.4;
    }

    /* 精简的装备剪影 */
    .equipment-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .equipment-silhouette {
      position: absolute;
      opacity: 0.06;
      fill: white;
    }

    .aircraft-simple {
      width: 140px;
      right: 15%;
      top: 15%;
    }

    .ship-simple {
      width: 160px;
      left: 12%;
      bottom: 20%;
    }

    .container {
      width: 100%;
      min-height: 100vh;
      padding: 80px 20px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Logo区域 */
    .top {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      gap: 16px;
    }

    .logo {
      width: 52px;
      height: 52px;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.15));
    }

    .title {
      font-size: 36px;
      color: #ffffff;
      font-weight: 700;
      letter-spacing: 3px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .desc {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.95);
      margin-top: 12px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }

    .org {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      margin-top: 6px;
    }

    /* 主登录卡片 */
    .main {
      width: 420px;
      max-width: 90%;
    }

    .user-layout-login {
      background: white;
      padding: 44px 48px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-title {
      font-size: 22px;
      font-weight: 600;
      color: rgba(0, 0, 0, 0.85);
      margin-bottom: 8px;
    }

    .login-subtitle {
      font-size: 14px;
      color: rgba(0, 0, 0, 0.45);
    }

    /* 表单 */
    .form-item {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      color: rgba(0, 0, 0, 0.85);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .input-wrapper {
      position: relative;
    }

    .input-prefix {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(0, 0, 0, 0.25);
      font-size: 16px;
      transition: color 0.3s;
    }

    .form-input {
      width: 100%;
      height: 44px;
      padding: 4px 11px 4px 42px;
      font-size: 15px;
      color: rgba(0, 0, 0, 0.85);
      background: #fff;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      transition: all 0.3s;
      outline: none;
    }

    .form-input:hover {
      border-color: #40a9ff;
    }

    .form-input:focus {
      border-color: #40a9ff;
      box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
    }

    .form-input:focus + .input-prefix,
    .form-input:not(:placeholder-shown) + .input-prefix {
      color: #1890FF;
    }

    .form-input::placeholder {
      color: rgba(0, 0, 0, 0.25);
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .checkbox {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #1890FF;
    }

    .checkbox-label {
      font-size: 14px;
      color: rgba(0, 0, 0, 0.65);
      cursor: pointer;
      user-select: none;
    }

    .forgot-link {
      font-size: 14px;
      color: #1890FF;
      text-decoration: none;
      transition: color 0.3s;
    }

    .forgot-link:hover {
      color: #40a9ff;
    }

    .login-button {
      width: 100%;
      height: 44px;
      font-size: 16px;
      font-weight: 500;
      color: #fff;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .login-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
    }

    .login-button:active {
      transform: translateY(0);
    }

    .login-button:disabled {
      background: #f5f5f5;
      color: rgba(0, 0, 0, 0.25);
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    /* IETM特性标签 */
    .features {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid #f0f0f0;
    }

    .feature-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: linear-gradient(135deg, #e6f7ff 0%, #f0f5ff 100%);
      border: 1px solid #91d5ff;
      border-radius: 16px;
      font-size: 13px;
      color: #0050b3;
      transition: all 0.3s;
    }

    .feature-badge:hover {
      background: linear-gradient(135deg, #d4edff 0%, #e6f0ff 100%);
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(24, 144, 255, 0.2);
    }

    .feature-icon-small {
      width: 14px;
      height: 14px;
    }

    /* 底部 */
    .footer {
      position: absolute;
      width: 100%;
      bottom: 0;
      padding: 24px;
      text-align: center;
      z-index: 1;
    }

    .copyright {
      color: rgba(255, 255, 255, 0.85);
      font-size: 14px;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .container {
        padding: 40px 16px;
      }

      .title {
        font-size: 28px;
      }

      .desc {
        font-size: 16px;
      }

      .user-layout-login {
        padding: 36px 32px;
      }

      .equipment-bg {
        opacity: 0.5;
      }
    }
  </style>
</head>
<body>
  <div id="userLayout">
    <div class="bg-overlay"></div>
    <div class="bg-grid"></div>

    <div class="equipment-bg">
      <!-- 简化的战机 -->
      <svg class="equipment-silhouette aircraft-simple" viewBox="0 0 140 60" xmlns="http://www.w3.org/2000/svg">
        <path d="M5,30 L30,28 L50,18 L70,15 L90,18 L110,23 L130,28 L135,30 L130,32 L110,35 L90,37 L70,38 L50,37 L30,35 L10,32 Z"/>
        <path d="M70,15 L68,25 L70,38 L72,25 Z"/>
      </svg>

      <!-- 简化的军舰 -->
      <svg class="equipment-silhouette ship-simple" viewBox="0 0 160 70" xmlns="http://www.w3.org/2000/svg">
        <path d="M10,45 L15,40 L145,40 L150,45 L145,50 L15,50 Z"/>
        <rect x="50" y="30" width="8" height="10"/>
        <rect x="80" y="25" width="10" height="15"/>
        <rect x="110" y="30" width="8" height="10"/>
      </svg>
    </div>

    <div class="container">
      <div class="top">
        <div class="logo-wrapper">
          <svg class="logo" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#1890FF"/>
                <stop offset="100%" style="stop-color:#0050b3"/>
              </linearGradient>
            </defs>
            <rect width="52" height="52" rx="10" fill="url(#logoGrad)"/>
            <rect x="8" y="8" width="36" height="36" fill="none" stroke="#fff" stroke-width="2.5"/>
            <rect x="14" y="22" width="24" height="22" fill="#fff"/>
            <circle cx="26" cy="16" r="4" fill="#fff"/>
            <path d="M26 3 L30 7 L26 11 L22 7 Z" fill="#ffd700"/>
          </svg>
          <span class="title">IETM</span>
        </div>
        <div class="desc">武器装备交互式电子技术手册</div>
        <div class="org">中国航空综合技术研究所</div>
      </div>

      <div class="main">
        <form class="user-layout-login" onsubmit="event.preventDefault(); handleLogin();">
          <div class="login-header">
            <h2 class="login-title">用户登录</h2>
            <p class="login-subtitle">欢迎使用IETM系统</p>
          </div>

          <div class="form-item">
            <label class="form-label">账号</label>
            <div class="input-wrapper">
              <input type="text" class="form-input" placeholder="请输入账号" value="admin" id="username" />
              <svg class="input-prefix" viewBox="64 64 896 896" width="1em" height="1em" fill="currentColor">
                <path d="M858.5 763.6a374 374 0 00-80.6-119.5 375.63 375.63 0 00-119.5-80.6c-.4-.2-.8-.3-1.2-.5C719.5 518 760 444.7 760 362c0-137-111-248-248-248S264 225 264 362c0 82.7 40.5 156 102.8 201.1-.4.2-.8.3-1.2.5-44.8 18.9-85 46-119.5 80.6a375.63 375.63 0 00-80.6 119.5A371.7 371.7 0 00136 901.8a8 8 0 008 8.2h60c4.4 0 7.9-3.5 8-7.8 2-77.2 33-149.5 87.8-204.3 56.7-56.7 132-87.9 212.2-87.9s155.5 31.2 212.2 87.9C779 752.7 810 825 812 902.2c.1 4.4 3.6 7.8 8 7.8h60a8 8 0 008-8.2c-1-47.8-10.9-94.3-29.5-138.2zM512 534c-45.9 0-89.1-17.9-121.6-50.4S340 407.9 340 362c0-45.9 17.9-89.1 50.4-121.6S466.1 190 512 190s89.1 17.9 121.6 50.4S684 316.1 684 362c0 45.9-17.9 89.1-50.4 121.6S557.9 534 512 534z"></path>
              </svg>
            </div>
          </div>

          <div class="form-item">
            <label class="form-label">密码</label>
            <div class="input-wrapper">
              <input type="password" class="form-input" placeholder="请输入密码" value="123456" id="password" />
              <svg class="input-prefix" viewBox="64 64 896 896" width="1em" height="1em" fill="currentColor">
                <path d="M832 464h-68V240c0-70.7-57.3-128-128-128H388c-70.7 0-128 57.3-128 128v224h-68c-17.7 0-32 14.3-32 32v384c0 17.7 14.3 32 32 32h640c17.7 0 32-14.3 32-32V496c0-17.7-14.3-32-32-32zM332 240c0-30.9 25.1-56 56-56h248c30.9 0 56 25.1 56 56v224H332V240zm460 600H232V536h560v304zM484 701v53c0 4.4 3.6 8 8 8h40c4.4 0 8-3.6 8-8v-53a48.01 48.01 0 10-56 0z"></path>
              </svg>
            </div>
          </div>

          <div class="form-options">
            <div class="checkbox-wrapper">
              <input type="checkbox" id="remember" class="checkbox" checked />
              <label for="remember" class="checkbox-label">记住我</label>
            </div>
            <a href="#" class="forgot-link" onclick="event.preventDefault(); alert('忘记密码');">忘记密码?</a>
          </div>

          <button type="submit" class="login-button" id="loginBtn">确定</button>

          <div class="features">
            <div class="feature-badge">
              <svg class="feature-icon-small" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
              </svg>
              <span>军工保密</span>
            </div>
            <div class="feature-badge">
              <svg class="feature-icon-small" fill="currentColor" viewBox="0 0 24 24">
                <path d="M21 16.5c0 .38-.21.71-.53.88l-7.9 4.44c-.16.12-.36.18-.57.18-.21 0-.41-.06-.57-.18l-7.9-4.44C3.21 17.21 3 16.88 3 16.5v-9c0-.38.21-.71.53-.88l7.9-4.44c.16-.12.36-.18.57-.18.21 0 .41.06.57.18l7.9 4.44c.32.17.53.5.53.88v9z"/>
              </svg>
              <span>3D模型</span>
            </div>
            <div class="feature-badge">
              <svg class="feature-icon-small" fill="currentColor" viewBox="0 0 24 24">
                <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6z"/>
              </svg>
              <span>技术手册</span>
            </div>
            <div class="feature-badge">
              <svg class="feature-icon-small" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
              </svg>
              <span>智能诊断</span>
            </div>
          </div>
        </form>
      </div>

      <div class="footer">
        <div class="copyright">
          Copyright © 2026 中国航空综合技术研究所 | 版权所有
        </div>
      </div>
    </div>
  </div>

  <script>
    function handleLogin() {
      const btn = document.getElementById('loginBtn');
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (!username) {
        alert('请输入账号');
        return;
      }

      if (!password) {
        alert('请输入密码');
        return;
      }

      btn.disabled = true;
      btn.textContent = '登录中...';

      setTimeout(() => {
        alert('登录成功！即将跳转到系统主页...');
        btn.disabled = false;
        btn.textContent = '确定';
      }, 1000);
    }
  </script>
</body>
</html>
