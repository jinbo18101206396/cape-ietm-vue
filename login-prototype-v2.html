<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IETM系统登录 - 系统风格版</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      color: rgba(0, 0, 0, 0.85);
      background: #f0f2f5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .login-wrapper {
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      position: relative;
      overflow: hidden;
    }

    /* 背景装饰元素 */
    .bg-decoration {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .bg-circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
    }

    .bg-circle:nth-child(1) {
      width: 600px;
      height: 600px;
      top: -200px;
      left: -200px;
    }

    .bg-circle:nth-child(2) {
      width: 400px;
      height: 400px;
      bottom: -150px;
      right: -100px;
    }

    .bg-circle:nth-child(3) {
      width: 300px;
      height: 300px;
      top: 50%;
      left: 10%;
    }

    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
      display: flex;
      align-items: center;
      gap: 60px;
    }

    /* 左侧信息区 */
    .info-section {
      flex: 1;
      color: white;
    }

    .system-logo {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 40px;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }

    .logo-icon svg {
      width: 28px;
      height: 28px;
      fill: white;
    }

    .logo-text {
      font-size: 28px;
      font-weight: 600;
      color: white;
      letter-spacing: 1px;
    }

    .info-title {
      font-size: 42px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 20px;
      color: white;
    }

    .info-description {
      font-size: 16px;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 40px;
    }

    .feature-list {
      display: grid;
      gap: 20px;
    }

    .feature-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .feature-icon {
      width: 24px;
      height: 24px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .feature-icon::before {
      content: '✓';
      color: white;
      font-size: 14px;
      font-weight: 600;
    }

    .feature-text {
      flex: 1;
    }

    .feature-title {
      font-size: 16px;
      font-weight: 500;
      color: white;
      margin-bottom: 4px;
    }

    .feature-desc {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.5;
    }

    /* 右侧登录卡片 */
    .login-card {
      flex: 0 0 420px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      overflow: hidden;
    }

    .card-header {
      padding: 32px 32px 24px;
      border-bottom: 1px solid #f0f0f0;
    }

    .card-title {
      font-size: 24px;
      font-weight: 600;
      color: rgba(0, 0, 0, 0.85);
      margin-bottom: 8px;
    }

    .card-subtitle {
      font-size: 14px;
      color: rgba(0, 0, 0, 0.45);
    }

    .card-body {
      padding: 32px;
    }

    .login-tabs {
      display: flex;
      gap: 24px;
      margin-bottom: 32px;
      border-bottom: 1px solid #f0f0f0;
    }

    .tab-item {
      padding: 0 4px 12px;
      font-size: 15px;
      color: rgba(0, 0, 0, 0.65);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.3s;
      position: relative;
      bottom: -1px;
    }

    .tab-item:hover {
      color: #1890FF;
    }

    .tab-item.active {
      color: #1890FF;
      border-bottom-color: #1890FF;
      font-weight: 500;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-label {
      font-size: 14px;
      color: rgba(0, 0, 0, 0.85);
      font-weight: 500;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: rgba(0, 0, 0, 0.25);
      z-index: 1;
    }

    .form-input {
      width: 100%;
      height: 40px;
      padding: 4px 11px 4px 40px;
      font-size: 14px;
      color: rgba(0, 0, 0, 0.85);
      background: #fff;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      transition: all 0.3s;
      outline: none;
    }

    .form-input:hover {
      border-color: #40a9ff;
    }

    .form-input:focus {
      border-color: #1890FF;
      box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
    }

    .form-input::placeholder {
      color: rgba(0, 0, 0, 0.25);
    }

    .form-extra {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: -4px;
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .checkbox {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #1890FF;
    }

    .checkbox-label {
      font-size: 14px;
      color: rgba(0, 0, 0, 0.65);
      cursor: pointer;
      user-select: none;
    }

    .forgot-link {
      font-size: 14px;
      color: #1890FF;
      text-decoration: none;
      transition: color 0.3s;
    }

    .forgot-link:hover {
      color: #40a9ff;
    }

    .submit-button {
      width: 100%;
      height: 40px;
      font-size: 16px;
      font-weight: 500;
      color: white;
      background: #1890FF;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 12px;
    }

    .submit-button:hover {
      background: #40a9ff;
    }

    .submit-button:active {
      background: #096dd9;
    }

    .divider {
      margin: 24px 0;
      text-align: center;
      position: relative;
    }

    .divider::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 1px;
      background: #f0f0f0;
    }

    .divider-text {
      position: relative;
      display: inline-block;
      padding: 0 16px;
      background: white;
      font-size: 14px;
      color: rgba(0, 0, 0, 0.45);
    }

    .other-login {
      display: flex;
      justify-content: center;
      gap: 24px;
    }

    .login-icon-btn {
      width: 40px;
      height: 40px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      background: white;
    }

    .login-icon-btn:hover {
      border-color: #1890FF;
      color: #1890FF;
    }

    .card-footer {
      padding: 16px 32px;
      background: #fafafa;
      text-align: center;
      font-size: 14px;
      color: rgba(0, 0, 0, 0.45);
    }

    .footer-link {
      color: #1890FF;
      text-decoration: none;
      margin-left: 4px;
    }

    .footer-link:hover {
      text-decoration: underline;
    }

    /* 响应式 */
    @media (max-width: 968px) {
      .login-container {
        flex-direction: column;
        gap: 40px;
      }

      .info-section {
        text-align: center;
      }

      .system-logo {
        justify-content: center;
      }

      .feature-item {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .login-card {
        flex: 0 0 auto;
        width: 100%;
        max-width: 420px;
      }

      .info-title {
        font-size: 32px;
      }
    }

    @media (max-width: 640px) {
      .login-container {
        padding: 20px;
      }

      .card-header,
      .card-body,
      .card-footer {
        padding-left: 24px;
        padding-right: 24px;
      }

      .info-title {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="bg-decoration">
      <div class="bg-circle"></div>
      <div class="bg-circle"></div>
      <div class="bg-circle"></div>
    </div>

    <div class="login-container">
      <!-- 左侧信息区 -->
      <div class="info-section">
        <div class="system-logo">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/>
            </svg>
          </div>
          <div class="logo-text">IETM System</div>
        </div>

        <h1 class="info-title">智能交互式<br/>电子技术手册系统</h1>
        <p class="info-description">
          为企业提供全生命周期的技术文档管理解决方案，助力数字化转型升级
        </p>

        <div class="feature-list">
          <div class="feature-item">
            <div class="feature-icon"></div>
            <div class="feature-text">
              <div class="feature-title">智能化管理</div>
              <div class="feature-desc">结构化存储，快速检索，版本追踪</div>
            </div>
          </div>
          <div class="feature-item">
            <div class="feature-icon"></div>
            <div class="feature-text">
              <div class="feature-title">交互式体验</div>
              <div class="feature-desc">3D模型展示，故障诊断，操作指引</div>
            </div>
          </div>
          <div class="feature-item">
            <div class="feature-icon"></div>
            <div class="feature-text">
              <div class="feature-title">多端协同</div>
              <div class="feature-desc">PC、平板、手机全平台支持</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 右侧登录卡片 -->
      <div class="login-card">
        <div class="card-header">
          <h2 class="card-title">用户登录</h2>
          <p class="card-subtitle">欢迎使用IETM系统</p>
        </div>

        <div class="card-body">
          <div class="login-tabs">
            <div class="tab-item active">账号密码登录</div>
            <div class="tab-item">手机号登录</div>
          </div>

          <form class="login-form" onsubmit="event.preventDefault(); alert('这是原型图演示');">
            <div class="form-item">
              <label class="form-label">账号</label>
              <div class="input-wrapper">
                <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
                <input
                  type="text"
                  class="form-input"
                  placeholder="请输入账号"
                  value="admin"
                />
              </div>
            </div>

            <div class="form-item">
              <label class="form-label">密码</label>
              <div class="input-wrapper">
                <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
                <input
                  type="password"
                  class="form-input"
                  placeholder="请输入密码"
                  value="123456"
                />
              </div>
            </div>

            <div class="form-extra">
              <div class="checkbox-wrapper">
                <input type="checkbox" id="remember" class="checkbox" checked />
                <label for="remember" class="checkbox-label">记住密码</label>
              </div>
              <a href="#" class="forgot-link" onclick="event.preventDefault(); alert('忘记密码功能');">忘记密码</a>
            </div>

            <button type="submit" class="submit-button">登录</button>
          </form>

          <div class="divider">
            <span class="divider-text">其他登录方式</span>
          </div>

          <div class="other-login">
            <div class="login-icon-btn" onclick="alert('微信登录')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.050-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.047c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-6.656-6.088V8.89c-.135-.01-.27-.027-.407-.03zm-2.53 3.274c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.969-.982z"/>
              </svg>
            </div>
            <div class="login-icon-btn" onclick="alert('支付宝登录')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M18.918 8.174c.922.092 1.544.088 2.572-.082-1.02 3.606-4.503 6.228-8.556 6.228-1.466 0-2.852-.352-4.09-.955 1.06-.635 2.846-1.763 4.465-2.764 2.31-1.426 3.733-2.615 5.609-2.427zm3.796 6.055c-.968.273-2.108.467-3.296.467-.883 0-1.745-.09-2.575-.252-.738-.144-1.46-.344-2.158-.596-.574-.21-1.137-.457-1.688-.737-1.323-.67-2.578-1.503-3.728-2.486a26.76 26.76 0 0 1-1.592-1.483C3.076 6.28.304 5.667.304 5.667 0 5.667 0 5.667 0 6.285c0 .417.072.823.201 1.208.13.385.32.748.56 1.078.24.33.53.625.86.876.33.25.7.45 1.094.59.525.188 1.088.282 1.653.282.883 0 1.745-.177 2.575-.528.73-.308 1.42-.716 2.046-1.214.626-.498 1.179-1.08 1.648-1.73.469-.65.848-1.36 1.128-2.114.28-.753.456-1.548.523-2.357h3.556c0 .35-.036.697-.107 1.04-.143.697-.432 1.36-.854 1.96-.422.6-.975 1.124-1.632 1.543-.656.42-1.407.724-2.214.897-.807.173-1.657.207-2.503.097-.846-.11-1.677-.35-2.453-.712-.776-.362-1.49-.854-2.106-1.456-.616-.602-1.126-1.31-1.506-2.096a5.83 5.83 0 0 1-.62-2.682c0-1.16.34-2.285.978-3.234.638-.95 1.548-1.72 2.622-2.215 1.074-.494 2.294-.744 3.514-.72a7.3 7.3 0 0 1 3.65.98c1.112.645 2.042 1.572 2.676 2.663.634 1.09.962 2.332.943 3.584-.015.957-.18 1.902-.48 2.81z"/>
              </svg>
            </div>
            <div class="login-icon-btn" onclick="alert('钉钉登录')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm6.063 14.766c-.09.314-.312.58-.612.73-.3.152-.647.175-.962.063l-5.16-1.822c-.402-.142-.608-.585-.466-.987.142-.403.585-.61.987-.467l5.16 1.822c.403.142.61.584.468.986zm.544-3.212c-.14.464-.615.736-1.078.61l-6.82-1.85c-.464-.127-.735-.614-.608-1.078.127-.464.614-.735 1.078-.608l6.82 1.85c.464.127.735.614.608 1.078z"/>
              </svg>
            </div>
          </div>
        </div>

        <div class="card-footer">
          还没有账号？<a href="#" class="footer-link" onclick="event.preventDefault(); alert('注册功能');">立即注册</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Tab切换交互
    document.querySelectorAll('.tab-item').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
      });
    });

    // 输入框交互
    document.querySelectorAll('.form-input').forEach(input => {
      input.addEventListener('focus', function() {
        this.closest('.input-wrapper').style.transform = 'translateY(-1px)';
      });

      input.addEventListener('blur', function() {
        this.closest('.input-wrapper').style.transform = 'translateY(0)';
      });
    });
  </script>
</body>
</html>
